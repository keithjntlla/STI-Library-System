<!doctype html>
<html lang="en" class="scroll-smooth" style="scroll-behavior: smooth;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b5ea2" />
    <meta
      name="description"
      content="STI Ormoc Smart Library Management System prototype"
    />
    <title>STI Ormoc Smart Library</title>
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('smartlib-theme')
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
            document.documentElement.dataset.theme = 'dark'
            document.documentElement.style.colorScheme = 'dark'
            var meta = document.querySelector('meta[name="theme-color"]')
            if (meta) meta.setAttribute('content', '#000d2b')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
